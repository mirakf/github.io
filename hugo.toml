baseURL = "https://mirakf.github.io/"
title = "Mira Kelly-Fair"
paginate = 5
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Mira Kelly-Fair"
  description = "PhD Candidate | Biogeographer | NSF-Strong Coasts Fellow"
  author = "Mira Kelly-Fair"

  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.profileMode]
    enabled = true
    title = "Mira Kelly-Fair"
    subtitle = "PhD Candidate | Biogeographer | NSF-Strong Coasts Fellow | Boston University<br>Mapping ecosystems from ridge to reef, one year at a time."
    imageUrl = "headshot2.jpg"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "Mira Kelly-Fair"

    [[params.profileMode.buttons]]
      name = "🌍 Belize Ecosystem Atlas"
      url = "/belize-ecosystem-atlas/"

    [[params.profileMode.buttons]]
      name = "📄 Publications"
      url = "/publications/"

    [[params.profileMode.buttons]]
      name = "💼 Work With Me"
      url = "/workwithme/"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/mirakf"

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/mirakellyfair/"

  [[params.socialIcons]]
    name = "email"
    title = "Email Me"
    url = "mailto:mirakf@bu.edu"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

